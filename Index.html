<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Seinäkalenteri</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  color: white;
  background: #111;
}

/* Taustakuva */
#background {
  position: fixed;
  inset: 0;
  background-size: cover;
  background-position: center;
  transition: opacity 1s ease;
  z-index: 0;
}

#shade {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.40);
  z-index: 1;
}

/* 1 cm tyhjää molemmille sivuille kehyksen takia */
.page {
  position: relative;
  z-index: 2;
  width: 100%;
  height: 100vh;

  padding:
    16px
    1cm
    12px
    1cm;

  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* Yläpalkki */

.header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.date {
  font-size: 28px;
  font-weight: 750;
  line-height: 1.05;
}

.weekday {
  font-size: 17px;
  opacity: 0.75;
  margin-top: 5px;
  text-transform: capitalize;
}

.clock {
  font-size: 45px;
  font-weight: 300;
  letter-spacing: -1px;
}

/* Sää */

.weather {
  min-height: 64px;
  padding: 10px 16px;

  display: flex;
  align-items: center;
  gap: 12px;

  border-radius: 20px;

  background: rgba(20,22,28,0.72);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);

  border: 1px solid rgba(255,255,255,0.15);
}

.weather-icon {
  font-size: 31px;
  width: 38px;
  text-align: center;
}

.temperature {
  font-size: 26px;
  font-weight: 650;
}

.weather-text {
  font-size: 12px;
  opacity: 0.70;
}

/* Kalenteri */

.calendar-box {
  flex: 1;
  min-height: 0;

  border-radius: 20px;

  background: rgba(20,22,28,0.76);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);

  border: 1px solid rgba(255,255,255,0.15);

  overflow: hidden;
}

.calendar-title {
  height: 42px;
  display: flex;
  align-items: center;

  padding: 0 15px;

  font-size: 14px;
  font-weight: 750;
  letter-spacing: 1.2px;
}

/*
 Google Calendar.
 Agenda-näkymä sopii seinäkalenteriin paljon paremmin
 kuin koko kuukausikalenteri.
*/

.calendar-frame {
  width: 100%;
  height: calc(100% - 42px);
  border: 0;
  background: white;
}

/* Alarivi */

.bottom {
  height: 27%;
  min-height: 125px;

  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.day {
  padding: 11px;

  border-radius: 16px;

  background: rgba(20,22,28,0.72);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);

  border: 1px solid rgba(255,255,255,0.15);

  overflow: hidden;
}

.day-name {
  font-size: 12px;
  font-weight: 700;
}

.day-info {
  margin-top: 7px;
  font-size: 11px;
  opacity: 0.65;
}

.footer {
  text-align: center;
  font-size: 9px;
  opacity: 0.50;
}
</style>
</head>

<body>

<div id="background"></div>
<div id="shade"></div>

<div class="page">

  <div class="header">

    <div>
      <div id="date" class="date"></div>
      <div id="weekday" class="weekday"></div>
    </div>

    <div id="clock" class="clock"></div>

  </div>


  <div class="weather">

    <div id="weatherIcon" class="weather-icon">
      ☁️
    </div>

    <div>
      <div id="temperature" class="temperature">
        --°
      </div>

      <div id="weatherText" class="weather-text">
        Haetaan säätä…
      </div>
    </div>

  </div>


  <div class="calendar-box">

    <div class="calendar-title">
      TAPAHTUMAT
    </div>

    <iframe
      class="calendar-frame"
      src="https://calendar.google.com/calendar/embed?src=55fef4f5ea4068befaf4bafa307629d6fdb461a64184b71e9b958588b5740d68%40group.calendar.google.com&ctz=Europe%2FHelsinki&mode=AGENDA&showTitle=0&showPrint=0&showTabs=0&showCalendars=0&showTz=0"
      scrolling="no">
    </iframe>

  </div>


  <div class="bottom">

    <div class="day">
      <div id="day1" class="day-name"></div>
      <div class="day-info">
        Kalenteri
      </div>
    </div>

    <div class="day">
      <div id="day2" class="day-name"></div>
      <div class="day-info">
        Kalenteri
      </div>
    </div>

    <div class="day">
      <div id="day3" class="day-name"></div>
      <div class="day-info">
        Kalenteri
      </div>
    </div>

  </div>


  <div class="footer">
    Seinäkalenteri · päivitetty <span id="updated"></span>
  </div>

</div>


<script>

/* =========================
   KELLO JA PÄIVÄ
========================= */

const weekdays = [
  "sunnuntai",
  "maanantai",
  "tiistai",
  "keskiviikko",
  "torstai",
  "perjantai",
  "lauantai"
];

const months = [
  "tammikuuta",
  "helmikuuta",
  "maaliskuuta",
  "huhtikuuta",
  "toukokuuta",
  "kesäkuuta",
  "heinäkuuta",
  "elokuuta",
  "syyskuuta",
  "lokakuuta",
  "marraskuuta",
  "joulukuuta"
];

function updateClock() {

  const now = new Date();

  document.getElementById("date").textContent =
    now.getDate() + ". " + months[now.getMonth()];

  document.getElementById("weekday").textContent =
    weekdays[now.getDay()];

  document.getElementById("clock").textContent =
    now.toLocaleTimeString("fi-FI", {
      hour: "2-digit",
      minute: "2-digit"
    });

  document.getElementById("updated").textContent =
    now.toLocaleTimeString("fi-FI", {
      hour: "2-digit",
      minute: "2-digit"
    });

  for (let i = 1; i <= 3; i++) {

    const d = new Date(now);
    d.setDate(now.getDate() + i);

    document.getElementById("day" + i).textContent =
      weekdays[d.getDay()].slice(0,3).toUpperCase()
      + " "
      + d.getDate()
      + "."
      + (d.getMonth()+1)
      + ".";

  }
}

updateClock();
setInterval(updateClock, 1000);


/* =========================
   SÄÄ ESPOO
========================= */

async function updateWeather() {

  try {

    const url =
      "https://api.open-meteo.com/v1/forecast" +
      "?latitude=60.2055" +
      "&longitude=24.6559" +
      "&current=temperature_2m,weather_code" +
      "&timezone=Europe%2FHelsinki";

    const response = await fetch(url);

    const data = await response.json();

    const code = data.current.weather_code;

    let icon = "☀️";
    let text = "Selkeää";

    if (code === 1 || code === 2) {
      icon = "🌤️";
      text = "Puolipilvistä";
    }

    else if (code === 3) {
      icon = "☁️";
      text = "Pilvistä";
    }

    else if (code >= 45 && code <= 48) {
      icon = "🌫️";
      text = "Sumua";
    }

    else if (code >= 51 && code <= 67) {
      icon = "🌧️";
      text = "Sadetta";
    }

    else if (code >= 71 && code <= 77) {
      icon = "🌨️";
      text = "Lunta";
    }

    else if (code >= 80 && code <= 82) {
      icon = "🌦️";
      text = "Kuuroja";
    }

    else if (code >= 95) {
      icon = "⛈️";
      text = "Ukkosta";
    }

    document.getElementById("weatherIcon").textContent = icon;

    document.getElementById("temperature").textContent =
      Math.round(data.current.temperature_2m) + "°";

    document.getElementById("weatherText").textContent =
      text + " · Espoo";

  }

  catch (error) {

    document.getElementById("weatherText").textContent =
      "Sää ei saatavilla";

  }

}

updateWeather();

setInterval(updateWeather, 15 * 60 * 1000);


/* =========================
   TAUSTAKUVAT
   vaihtuu 5 sekunnin välein
========================= */

const backgrounds = [

  "https://picsum.photos/seed/home1/1200/2000",

  "https://picsum.photos/seed/home2/1200/2000",

  "https://picsum.photos/seed/home3/1200/2000",

  "https://picsum.photos/seed/home4/1200/2000",

  "https://picsum.photos/seed/home5/1200/2000"

];

let backgroundIndex = 0;

function changeBackground() {

  document.getElementById("background").style.backgroundImage =
    "url('" +
    backgrounds[backgroundIndex] +
    "')";

  backgroundIndex++;

  if (backgroundIndex >= backgrounds.length) {
    backgroundIndex = 0;
  }

}

changeBackground();

setInterval(changeBackground, 5000);

</script>

</body>
</html>
